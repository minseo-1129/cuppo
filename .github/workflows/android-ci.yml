name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Bootstrap Android project and assets
        run: ./tool/bootstrap_android.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build CI app bundle
        run: flutter build appbundle --release

      - name: Upload CI bundle
        uses: actions/upload-artifact@v4
        with:
          name: cuppo-ci-aab-not-for-play
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
